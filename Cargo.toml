[workspace]
members = [".", "tools/nagato-trainer"]
resolver = "2"

[package]
name = "nagato"
version = "1.2.0"
edition = "2021"
description = "Nagato — a chess engine forged in Rust, named after the IJN Nagato"
license = "GPL-3.0-or-later"

[features]
default = ["kbnk-scaling"]
kbnk-scaling = []
sphere-search = []

[dependencies]
rand = "0.8"
shakmaty = "0.30.0"
shakmaty-syzygy = "0.28.0"

[features]
# Correction history: blend historical (search - static eval) error into the
# static eval, keyed by pawn structure + side. Off by default (A/B-tested).
corrhist = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
